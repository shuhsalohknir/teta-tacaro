h4{margin:12px 0 6px;font-size:12px;color:var(--mu);font-weight:600}.help{color:var(--mu);font-size:12px;line-height:1.6}

.f{display:grid;grid-template-columns:104px 1fr;gap:5px;margin-bottom:5px;align-items:center}.f input,.f select{width:100%;min-width:0}
.f .cw{display:flex;gap:4px}.f .cw button{padding:0 7px}
