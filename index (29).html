<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teta Tacaro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; overflow: hidden; background: #0f172a; font-family: Arial, sans-serif; touch-action: none; user-select: none; }
  #menu, #lobby, #roomMenu {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at center, rgba(20,12,4,.35) 0%, rgba(12,7,2,.78) 100%),
      linear-gradient(rgba(20,12,4,.25), rgba(20,12,4,.25)),
      #1a1109 url('menu-bg.jpg') center / cover no-repeat;
    z-index: 100; color: #fff;
  }
  #lobby, #roomMenu { display: none; }
  /* Título low poly: fontes em bloco + facetas em degradê de cortes duros + extrusão marrom */
  h1 {
    font-family: 'Bungee', Impact, 'Arial Black', sans-serif; font-weight: 400;
    font-size: clamp(34px, 8vw, 68px); margin: 0 0 8px; text-align: center; letter-spacing: 3px; line-height: 1.05;
    background:
      linear-gradient(118deg, #fff0a0 0 18%, #ffd84a 18% 38%, #f2b92e 38% 52%, #ffe066 52% 70%, #e3a41f 70% 84%, #ffd24a 84%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 1px 0 #8a5a1f) drop-shadow(0 2px 0 #7a4c18) drop-shadow(0 3px 0 #6a4014)
            drop-shadow(0 4px 0 #5a350f) drop-shadow(0 5px 0 #4a2b0b) drop-shadow(0 10px 14px rgba(0,0,0,.7));
  }
  .subtitle { color: #e9d9b4; margin-bottom: 30px; text-align: center; letter-spacing: 3px; text-transform: uppercase; font-size: 13px; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  button.menu-btn {
    width: 280px; padding: 15px 16px; margin: 8px; font-size: 15px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
    border: 1px solid rgba(0,0,0,.35); border-bottom: 4px solid rgba(0,0,0,.4); border-radius: 6px; cursor: pointer;
    box-shadow: 0 6px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.28);
    transition: filter .15s, transform .1s, box-shadow .15s;
  }
  button.menu-btn:hover { filter: brightness(1.1); }
  button.menu-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
  /* amarelo mostarda (principal) */
  .btn-solo { background: linear-gradient(#e8bd4e, #c9962b); color: #3b2410; text-shadow: 0 1px 0 rgba(255,255,255,.3); }
  /* marrom suave (secundário) */
  .btn-online { background: linear-gradient(#8b6035, #6b4423); color: #f6e7c1; border-color: rgba(232,189,78,.55); text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  /* marrom escuro translúcido (voltar) */
  .btn-back { background: rgba(45,28,13,.85); color: #d9c597; margin-top: 15px; border-color: rgba(217,197,151,.3); }
  input { padding: 12px; font-size: 16px; border-radius: 6px; border: 2px solid #8b6035; background: #f6ecd2; color: #3b2410; margin: 8px; width: 260px; }
  #playerList { background: rgba(35,21,9,.78); border: 1px solid rgba(232,189,78,.35); padding: 20px; border-radius: 8px; min-width: 280px; margin: 15px 0; }
  .player { padding: 8px; margin: 4px 0; background: rgba(255,255,255,.1); border-radius: 6px; }
  #game { 
    display: none; 
    position: fixed; 
    top: 0; left: 0; 
    width: 100vw; 
    height: 100vh; 
    z-index: 1; 
    background: #87ceeb;
  }
  #game canvas { 
    display: block !important; 
    width: 100% !important; 
    height: 100% !important; 
    position: absolute; 
    top: 0; left: 0;
  }
  #info { position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,.6); padding: 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; z-index: 20; pointer-events: none; }
  #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; margin: -4px; border: 2px solid rgba(255,255,255,.8); border-radius: 50%; z-index: 20; pointer-events: none; }
  #healthBar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 220px; height: 18px; background: rgba(0,0,0,.6); border: 2px solid #fff; border-radius: 9px; overflow: hidden; z-index: 20; }
  #healthFill { height: 100%; background: linear-gradient(#4ade80, #16a34a); width: 100%; transition: width .2s; }
  #item { position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); color: #fde047; font-weight: bold; font-size: 14px; text-shadow: 0 1px 3px #000; z-index: 20; pointer-events: none; }
  #hurt { position: absolute; inset: 0; background: radial-gradient(transparent 40%, rgba(220,38,38,.55)); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 15; }
  #joystick-zone { position: absolute; bottom: 40px; left: 30px; width: 130px; height: 130px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.3); border-radius: 50%; z-index: 30; display: none; touch-action: none; }
  #joystick-thumb { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 46px; height: 46px; background: rgba(255,255,255,.5); border-radius: 50%; }
  #atkBtn { position: absolute; bottom: 50px; right: 30px; width: 90px; height: 90px; border-radius: 50%; border: 3px solid #fff; background: rgba(239,68,68,.75); color: #fff; font-weight: bold; z-index: 30; display: none; }
  #endScreen { position: absolute; inset: 0; background: rgba(0,0,0,.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; color: #fff; text-align: center; padding: 20px; }
  #endScreen .stats { background: rgba(255,255,255,.1); padding: 20px; border-radius: 12px; margin: 20px 0; min-width: 280px; font-size: 18px; }
  #throwBtn { position: absolute; bottom: 60px; right: 135px; width: 72px; height: 72px; border-radius: 50%; border: 3px solid #fff; background: rgba(59,130,246,.75); color: #fff; font-weight: bold; font-size: 10px; z-index: 30; display: none; }
  #frost { position: absolute; inset: 0; pointer-events: none; z-index: 14; opacity: 0; background: radial-gradient(ellipse at center, rgba(200,235,255,0) 45%, rgba(170,220,255,.55) 80%, rgba(235,248,255,.85)); }
  #temp { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: none; color: #e0f2fe; background: rgba(8,20,40,.7); border: 1px solid rgba(147,197,253,.6); padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; z-index: 36; pointer-events: none; }
  #bossBar { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); width: min(70vw, 360px); display: none; text-align: center; color: #bae6fd; font-size: 13px; z-index: 36; pointer-events: none; text-shadow: 0 1px 3px #000; }
  #bossHp { height: 10px; margin: 4px 0 2px; background: rgba(0,0,0,.6); border: 2px solid #bae6fd; border-radius: 6px; overflow: hidden; }
  #bossFill { height: 100%; width: 100%; background: linear-gradient(#7dd3fc, #0284c7); }
  #pickBtn { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); padding: 12px 22px; border: 2px solid #fde047; border-radius: 12px; background: rgba(0,0,0,.75); color: #fde047; font-weight: bold; font-size: 15px; z-index: 35; display: none; }
  #invBtn { position: absolute; top: 10px; right: 10px; width: 48px; height: 48px; border-radius: 12px; border: 2px solid #fff; background: rgba(0,0,0,.6); font-size: 24px; z-index: 35; }
  #inv { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(92vw, 420px); max-height: 90vh; overflow: auto; background: rgba(15,23,42,.96); color: #fff; border: 2px solid #475569; border-radius: 16px; padding: 16px; z-index: 60; }
  #inv h3 { margin: 0 0 10px; } #slots { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .slot { padding: 12px 4px; min-height: 64px; border-radius: 10px; border: 2px solid #475569; background: #1e293b; color: #fff; font-size: 13px; }
  .slot.sel { border-color: #60a5fa; background: #1e3a8a; } .slot.eq { box-shadow: 0 0 0 2px #22c55e inset; }
  #invBtns { display: flex; gap: 8px; margin: 12px 0; } #invBtns button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; background: #3b82f6; color: #fff; } #invBtns button:disabled { opacity: .4; }
  #recipes { font-size: 12px; color: #cbd5e1; line-height: 1.6; }
  #toast { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 8px 16px; border-radius: 10px; font-size: 14px; z-index: 40; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #err { display: none; position: absolute; bottom: 0; left: 0; right: 0; background: #7f1d1d; color: #fff; padding: 8px; font-size: 12px; z-index: 999; }
</style>

<body>
<div id="menu">
  <h1>TETA TACARO</h1>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.1/umd/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const $ = id => document.getElementById(id);
window.addEventListener('error', e => { const b = $('err'); b.style.display = 'block'; b.textContent = 'Erro: ' + e.message; });

const SERVER_URL = "https://teta-tacaro.onrender.com";
const isTouch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
const W = 140, D = 140, H = 5;
let socket = null, myId = null, currentRoom = null, lobbyPlayers = [];
let scene, camera, renderer, clock, started = false;
let colliders = [], ais = [], others = {};
let isSolo = false, gameOver = false, health = 100, kills = 0, lastAtk = 0, lastSend = 0;
let yaw = 0, pitch = 0, bob = 0;
const keys = {}, jv = { x: 0, y: 0 };

/* =====================================================================
   MODELOS · TINTAS · ANIMAÇÕES
   (bloco novo — substitui o antigo "Modelos 3D / getModel / makeChar / walkAnim")
   ===================================================================== */
/* ---------- REGRAS DE PINTURA (corpos sem textura) ----------
   h = altura 0..1 (pés→cabeça) · s = distância lateral ao centro / altura · d = profundidade (+ = frente) / altura */
const BODY_SPECS = {
  // male.obj: pose em A, olha para +Z, Y é "para cima"
  male:  { up:'y', side:'x', depth:'z', face:+1,
           shoe:.05, shirtLo:.52, head:.835, armLo:.40, armHi:.88, armS:.15, sleeveS:.185, hairTop:.945, hairBack:.90, backD:-.012 },
  // woman.fbx: geometria bruta em Z-up, braços em T ao longo de Y
  woman: { up:'z', side:'y', depth:'x', face:0,
           shoe:.06, shirtLo:.47, head:.80, armLo:.70, armHi:.84, armS:.13, sleeveS:.21, hairTop:.945, hairBack:2, backD:0 }
};
function classifyBody(h, s, d, P) {
  if (h < P.shoe) return 'shoe';
  if (h > P.armLo && h < P.armHi && s > P.armS) return s < P.sleeveS ? 'shirt' : 'skin';
  if (h >= P.head) return (h > P.hairTop || (h > P.hairBack && d < P.backD)) ? 'hair' : 'skin';
  if (h >= P.shirtLo) return 'shirt';
  return 'pants';
}


const texImg = {}, texCache = {}, carTexCache = {};
const models = {};          // modelos originais carregados (nunca alterados; sempre clonamos)
const clips = {};           // animações cruas dos FBX
const clipLib = {};         // animações já separadas (idle/walk/run/punch/slash/death)
const protoCache = {};      // itens prontos (pintados, normalizados)
const ACTORS = [];          // todos os personagens animados em cena

const gltfLoader = new THREE.GLTFLoader();
const fbxLoader = new THREE.FBXLoader();
const objLoader = new THREE.OBJLoader();

/* Quem aparece no jogo e como é animado.
   clip  = usa as animações gravadas dentro do .fbx (man, woman)
   bone  = esqueleto Mixamo sem animação gravada: movemos os ossos por código (guy)
   puppet= malha sem esqueleto: balanço/inclinação do corpo todo (male, vrgirl)
   Edite CHAR_POOL para escolher/ordenar os personagens. */
const CHAR_POOL = ['man', 'woman', 'guy', 'vrgirl', 'vrgirl2', 'male'];
const ACTOR_KIND = { man: 'clip', woman: 'clip', guy: 'bone', male: 'puppet', vrgirl: 'puppet', vrgirl2: 'puppet' };
const RIGGED = ['man', 'woman', 'guy'];
const SKINS = [0xf1c6a0, 0xd9a67a, 0xb97a50, 0x8d5a3a, 0xe8b894];
const HAIRS = [0x2b1a10, 0x6b4423, 0x111111, 0xb5651d, 0x4a3320];
const PANTS = [0x1e3a8a, 0x374151, 0x3f3f46, 0x14532d, 0x4a2c1d];
let charCounter = 0;

const nk = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const lighten = (hex, t) => new THREE.Color(hex).lerp(new THREE.Color(0xffffff), t).getHex();
const darken = (hex, t) => new THREE.Color(hex).lerp(new THREE.Color(0x000000), t).getHex();
const _lerp = (a, b, t) => a + (b - a) * t;
const _ease = x => x * x * (3 - 2 * x);
const _clamp = (x, a, b) => Math.max(a, Math.min(b, x));

/* ---------- CARREGAMENTO ---------- */
function loadModels() {
  const files = [
    ['guy', 'models/guy.glb', gltfLoader, g => g.scene],
    ['man', 'models/man.fbx', fbxLoader, g => { clips.man = g.animations || []; return g; }],
    ['woman', 'models/woman.fbx', fbxLoader, g => { clips.woman = g.animations || []; return g; }],
    ['male', 'models/male.obj', objLoader, g => g],
    ['vrgirl', 'models/vrgirl.obj', objLoader, g => g],
    ['broom', 'models/broom.obj', objLoader, g => g],
    ['bottle', 'models/bottle.obj', objLoader, g => g],
    ['bread', 'models/bread.obj', objLoader, g => g],
    ['pan', 'models/pan_poly.obj', objLoader, g => g],
    ['ham', 'models/ham.obj', objLoader, g => g],
    ['toilet', 'models/toilet.obj', objLoader, g => g],
    ['tree', 'models/tree.obj', objLoader, g => g],
    ['firtree', 'models/firtree.obj', objLoader, g => g],
    ['car', 'models/car.obj', objLoader, g => g]
  ];
  const imgs = ['car', 'tree'].map(n => new Promise(r => { const im = new Image(); im.onload = () => { texImg[n] = im; r(); }; im.onerror = () => { console.warn('✗ textura', n); r(); }; im.src = 'models/' + n + '_texture.png'; }));
  return Promise.all(files.map(([name, path, loader, extract]) =>
    new Promise(resolve => {
      loader.load(path,
        g => { try { models[name] = extract(g); console.log('✓', name); } catch (e) { console.warn('✗', name, e); } resolve(); },
        undefined,
        err => { console.warn('✗', name); resolve(); }
      );
    })
  ).concat(imgs)).then(() => {
    try { splitVRGirl(); } catch (e) { console.warn('vrgirl split', e); }
    ['man', 'woman'].forEach(n => { try { prepareClips(n); } catch (e) { console.warn('clips', n, e); } });
  });
}

/* vrgirl.obj contém DUAS meninas lado a lado (esquerda com visor, direita com headset). Separamos em duas. */
function splitVRGirl() {
  const src = models.vrgirl; if (!src) return;
  const L = new THREE.Group(), R = new THREE.Group(), meshes = [];
  src.traverse(o => { if (o.isMesh) meshes.push(o); });
  meshes.forEach(m => {
    m.geometry.computeBoundingBox();
    const bb = m.geometry.boundingBox;
    ((bb.min.x + bb.max.x) / 2 < 0 ? L : R).add(m);
  });
  models.vrgirl = L; models.vrgirl2 = R;
}

/* Separa os clipes por nome e remove movimento do quadril (o jogo é quem move o personagem). */
function prepareClips(name) {
  const list = clips[name]; if (!list || !list.length) return;
  const find = re => list.find(c => re.test(c.name.split('|').pop()));
  const strip = c => c ? new THREE.AnimationClip(c.name, c.duration, c.tracks.filter(t => !/\.position$/.test(t.name))) : null;
  clipLib[name] = {
    idle: strip(find(/^(?!.*(sit|stand)).*idle/i) || find(/stand/i)),
    walk: strip(find(/walk/i)),
    run: strip(find(/^(?!.*jump).*run/i)),
    punch: strip(find(/punch/i)),
    slash: strip(find(/slash/i)),
    death: find(/death/i) || null          // a queda mantém a translação do quadril
  };
  console.log('clipes', name, Object.keys(clipLib[name]).filter(k => clipLib[name][k]).join(','));
}

/* ---------- MATERIAIS / PINTURA ---------- */
function matFrom(spec, skinned) {
  const o = (typeof spec === 'object') ? spec : { c: spec };
  return new THREE.MeshStandardMaterial({
    color: o.c, roughness: o.r !== undefined ? o.r : .75, metalness: o.m || 0,
    transparent: o.a !== undefined, opacity: o.a !== undefined ? o.a : 1,
    skinning: !!skinned, vertexColors: !!o.vc
  });
}
/* troca os materiais pelo NOME (ex.: Skin, Shirt, mat17…) */
function recolor(root, table) {
  root.traverse(c => {
    if (!c.isMesh) return;
    const sk = !!c.isSkinnedMesh;
    const swap = m => {
      const s = table[nk(m && m.name)];
      if (s !== undefined) return matFrom(s, sk);
      return table['*'] !== undefined ? matFrom(table['*'], sk) : m;
    };
    c.material = Array.isArray(c.material) ? c.material.map(swap) : swap(c.material);
    c.castShadow = c.receiveShadow = true;
    if (sk) c.frustumCulled = false;
  });
}
/* pinta por região do corpo (cabeça/camisa/calça/sapato…) quando a malha não tem materiais separados */
function paintBody(root, specName, pal) {
  const spec = BODY_SPECS[specName], ax = { x: 0, y: 1, z: 2 };
  root.traverse(mesh => {
    if (!mesh.isMesh) return;
    const g = mesh.geometry.clone(); g.computeBoundingBox();
    const bb = g.boundingBox, lo = [bb.min.x, bb.min.y, bb.min.z], hi = [bb.max.x, bb.max.y, bb.max.z];
    const u = ax[spec.up], si = ax[spec.side], di = ax[spec.depth];
    const H = hi[u] - lo[u], cs = (lo[si] + hi[si]) / 2, cd = (lo[di] + hi[di]) / 2;
    const P = g.attributes.position, n = P.count, col = new Float32Array(n * 3), c = new THREE.Color(), t = [0, 0, 0];
    for (let i = 0; i < n; i++) {
      t[0] = P.getX(i); t[1] = P.getY(i); t[2] = P.getZ(i);
      c.set(pal[classifyBody((t[u] - lo[u]) / H, Math.abs(t[si] - cs) / H, spec.face * (t[di] - cd) / H, spec)]);
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    mesh.geometry = g;
    mesh.material = matFrom({ c: 0xffffff, r: .8, vc: true }, mesh.isSkinnedMesh);
    mesh.castShadow = mesh.receiveShadow = true;
    if (mesh.isSkinnedMesh) mesh.frustumCulled = false;
  });
}
/* pinta por altura (cabo × panela, tronco × copa…). stops = [[alturaMax 0..1, cor], …] */

  if (Math.abs(x) > W / 2 - r - .3 || Math.abs(z) > D / 2 - r - .3) return true;

}

}

  addEventListener('keyup', e => keys[e.code] = false);

    return;
  }
  const jz = $('joystick-zone'), th = $('joystick-thumb');
  let joyId = null, lookId = null, lx = 0, ly = 0;
  const joy = t => {
    const r = jz.getBoundingClientRect();
    let dx = (t.clientX - r.left - r.width / 2) / 50, dy = (t.clientY - r.top - r.height / 2) / 50, l = Math.hypot(dx, dy);

  };
  jz.addEventListener('touchstart', e => { joyId = e.changedTouches[0].identifier; joy(e.changedTouches[0]); e.preventDefault(); }, { passive: false });
  cv.addEventListener('touchstart', e => { const t = e.changedTouches[0]; lookId = t.identifier; lx = t.clientX; ly = t.clientY; }, { passive: true });
  addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyId) joy(t);
      else if (t.identifier === lookId) {
        yaw -= (t.clientX - lx) * .005; pitch = Math.max(-1.3, Math.min(1.3, pitch - (t.clientY - ly) * .005)); lx = t.clientX; ly = t.clientY;
      }

  }, { passive: true });
  addEventListener('touchend', e => {
    for (const t of e.changedTouches) {

      if (t.identifier === lookId) lookId = null;
    }
  });
  $('atkBtn').addEventListener('touchstart', e => { attack(); e.preventDefault(); }, { passive: false });
  $('throwBtn').addEventListener('touchstart', e => { throwItem(); e.preventDefault(); }, { passive: false });
}

function tempAt(x, z) {

  }
  if (x >= -48 && x <= -40 && z > -33 && z < -29) return { t: _lerp(18, 15, _clamp((-40 - x) / 8, 0, 1)), n: 'CORREDOR' };

/* regiões: 0 congelados · 1 resfriados · 2 corredor · 3 resto do mercado — o monstro passa pelas portas */
function regionOf(x, z) {
  if (x < -48) { if (z >= -64 && z < -46) return 0; if (z >= -46 && z <= -26) return 1; return 3; }

    if (a === 1) return (px < -48.6 && Math.abs(pz + 31) > 1.2) ? [-50.5, -31] : [-45.5, -31];
    return [-38.5, -31];
  }
  if (a === 3) return (px > -38 && Math.hypot(px + 37, pz + 31) > 1) ? [-37, -31] : [-42, -31];   // entrando

}

  } else bar.style.display = 'none';

    if (m.awake && m.net) { const k = Math.min(1, dt * 10); p.x = _lerp(p.x, m.net.x, k); p.z = _lerp(p.z, m.net.z, k); m.root.rotation.y += angDiff(m.root.rotation.y, m.net.rotY || 0) * k; }

function pickup(){

    const b=document.createElement('button');b.className='slot'+(sel.includes(i)?' sel':'')+(inv[i]!==undefined&&inv[i]===weapon?' eq':'');

  if(sel.length!==2)return;

  try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),gn=ac.createGain();o.frequency.value=55;gn.gain.value=.01;o.connect(gn);gn.connect(ac.destination);o.start();}catch(e){}
}

let glowT,flick=[];

}

  [[18,-62,0xb91c1c],[24,-62,0x1d4ed8],[30,-62,0x15803d],[42,-62,0xf59e0b],[18,-56,0x0e7490]].forEach(([x,z,c])=>{box(2.4,2.6,6,std(c,{metalness:.4,roughness:.5}),x,1.3,z);box(2.5,.1,6.1,std(0x111111),x,2.62,z,false);});
  [10,13].forEach(x=>box(1.8,1.2,1,std(0x166534),x,.6,-45));

  for(let i=0;i<8;i++){const z=-22+i*3.4,k=2+(i%3);box(1.2,.14,1.2,pw,35.5,.07,z,false);for(let l=0;l<k;l++)box(1.1,.7,1.1,std(cb[(i+l)%4],{roughness:.8}),35.5,.49+l*.7,z,l===k-1);}
  const sp=[];for(let i=0;i<400;i++){const a=Math.random()*6.283,e=Math.random()*1.2+.1;sp.push(Math.cos(a)*Math.cos(e)*265,Math.sin(e)*265,Math.sin(a)*Math.cos(e)*265);}
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,fog:false})));

/* ---------- TEXTURAS COM RELEVO, SUJEIRA E ASSETS OPCIONAIS ---------- */
const MATS={};
const boxTex=()=>canvasTex(128,128,(g,w,h)=>{g.fillStyle='#e9e9e9';g.fillRect(0,0,w,h);for(let i=0;i<1200;i++){g.fillStyle=Math.random()<.5?'rgba(0,0,0,.06)':'rgba(255,255,255,.18)';g.fillRect(Math.random()*w,Math.random()*h,2,1);}g.fillStyle='#bdbdbd';g.fillRect(0,h*.44,w,h*.12);g.fillStyle='#fff';g.fillRect(w*.12,h*.64,w*.42,h*.24);g.fillStyle='#555';for(let i=0;i<4;i++)g.fillRect(w*.16,h*.68+i*7,w*.34,2);g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=3;g.strokeRect(0,0,w,h);},1,1);

function tryTextures(){ // opcional: coloque assets/floor_color.jpg, floor_normal.jpg, floor_rough.jpg (idem asphalt_ e box_)
  const L=new THREE.TextureLoader(),ld=(f,rx,ry,cb)=>L.load('assets/'+f,t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;cb(t);},undefined,()=>{});

/* ---------- carros e árvores com textura ---------- */
function plainTex(n) {
  if (!texImg[n]) return null;
  if (!texCache[n]) { const t = new THREE.Texture(texImg[n]); t.needsUpdate = true; t.magFilter = THREE.NearestFilter; texCache[n] = t; }
  return texCache[n];
}
/* repinta só a "carroceria azul" da textura do carro, mantendo o sombreado */
function carTexture(hex) {
  if (!texImg.car) return null;
  if (carTexCache[hex]) return carTexCache[hex];
  try {
    const im = texImg.car, cv = document.createElement('canvas'); cv.width = im.width; cv.height = im.height;
    const cx = cv.getContext('2d'); cx.drawImage(im, 0, 0);
    const d = cx.getImageData(0, 0, cv.width, cv.height), p = d.data, T = new THREE.Color(hex), B = [0, 118, 179], bl = .299 * B[0] + .587 * B[1] + .114 * B[2];
    for (let i = 0; i < p.length; i += 4) {
      const dr = p[i] - B[0], dg = p[i + 1] - B[1], db = p[i + 2] - B[2];
      if (dr * dr + dg * dg + db * db < 1600) {
        const k = (.299 * p[i] + .587 * p[i + 1] + .114 * p[i + 2]) / bl;
        p[i] = Math.min(255, T.r * 255 * k); p[i + 1] = Math.min(255, T.g * 255 * k); p[i + 2] = Math.min(255, T.b * 255 * k);
      }
    }
    cx.putImageData(d, 0, 0);
    const t = new THREE.CanvasTexture(cv); t.magFilter = THREE.NearestFilter;
    return (carTexCache[hex] = t);
  } catch (e) { console.warn('textura do carro', e); return null; }
}
/* clona um modelo carregado, escala, apoia no chão e coloca em (x,z) */
function dropModel(name, mat, x, z, ry, scaleBy, anchorLow) {
  const src = models[name]; if (!src) return false;
  const m = src.clone(true);
  m.traverse(o => { if (o.isMesh) { o.material = mat; o.castShadow = o.receiveShadow = true; } });
  const g = new THREE.Group(); g.add(m);
  m.scale.setScalar(scaleBy(new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3())));
  m.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(m);
  let cx = (b.min.x + b.max.x) / 2, cz = (b.min.z + b.max.z) / 2;
  if (anchorLow) {   // centra no tronco (vértices da base), não na copa
    const v = new THREE.Vector3(); let sx = 0, sz = 0, n = 0, lim = b.min.y + .06 * (b.max.y - b.min.y);
    m.traverse(o => { if (!o.isMesh) return; const p = o.geometry.attributes.position; for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld); if (v.y < lim) { sx += v.x; sz += v.z; n++; } } });
    if (n) { cx = sx / n; cz = sz / n; }
  }
  m.position.set(-cx, -b.min.y, -cz);
  g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  return true;
}
function placeCar(x, z, hex, ry) {
  if (!models.car) return false;
  const t = carTexture(hex) || plainTex('car');
  const mat = new THREE.MeshStandardMaterial({ map: t || null, color: (t && t === carTexCache[hex]) ? 0xffffff : hex, roughness: .4, metalness: .25 });
  return dropModel('car', mat, x, z, ry || 0, s => 4.4 / Math.max(s.x, s.z), false);
}
const treeMats = {};
function placeTree(x, z, night) {
  if (!models.tree) return false;
  const k = night ? 'n' : 'd';
  if (!treeMats[k]) treeMats[k] = new THREE.MeshStandardMaterial({ map: plainTex('tree'), color: night ? 0x8d9fb0 : 0xffffff, roughness: .9 });
  const h = Math.abs(Math.sin(x * 12.9898 + z * 78.233) * 43758.5453) % 1;
  return dropModel('tree', treeMats[k], x, z, h * 6.28, s => (4.6 + h * 2.2) / s.y, true);
}
/* instancia o presunto (uma InstancedMesh por material do modelo) */
function hamInst(arr) {
  const hp = getItem('ham'); if (!hp) return;
  hp.updateMatrixWorld(true);
  const e = new THREE.Euler(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3(), M = new THREE.Matrix4();
  hp.traverse(me => {
    if (!me.isMesh) return;
    const g = me.geometry.clone().applyMatrix4(me.matrixWorld), im = new THREE.InstancedMesh(g, me.material, arr.length);
    arr.forEach((a, i) => { e.set(a[4], a[5], a[6], 'YXZ'); q.setFromEuler(e); p.set(a[0], a[1], a[2]); sc.setScalar(a[3]); M.compose(p, q, sc); im.setMatrixAt(i, M); });
    im.castShadow = im.receiveShadow = true; scene.add(im);
  });
}
function useModel(g,file,len,x,z){ // opcional: assets/car.glb substitui o carro modelado por código
  if(!THREE.GLTFLoader)return;
  new THREE.GLTFLoader().load('assets/'+file,gl=>{
    const m=gl.scene,sz=new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3());
    if(sz.x>sz.z)m.rotation.y=Math.PI/2;
    const b=new THREE.Box3().setFromObject(m),k=len/Math.max(sz.x,sz.z);m.scale.setScalar(k);
    const b2=new THREE.Box3().setFromObject(m);m.position.set(x-(b2.min.x+b2.max.x)/2,-b2.min.y,z-(b2.min.z+b2.max.z)/2);
    m.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;}});scene.add(m);g.visible=false;
  },undefined,()=>{});
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  if (!gameOver) update(dt, clock.elapsedTime);
  fxUpdate(dt, clock.elapsedTime);
  updateActors(dt);
  updateProjs(dt);
  try { coldUpdate(dt, clock.elapsedTime); } catch (e) { if (!coldUpdate.err) { coldUpdate.err = 1; console.warn('coldUpdate', e); } }
  renderer.render(scene, camera);
}
