<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teta Tacaro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; overflow: hidden; background: #0f172a; font-family: Arial, sans-serif; touch-action: none; user-select: none; }
  #menu, #lobby, #roomMenu {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #334155, #0f172a 70%); z-index: 100; color: #fff;
  }
  #lobby, #roomMenu { display: none; }
  h1 { font-size: 42px; margin: 0 0 10px; text-align: center; letter-spacing: 2px; }
  .subtitle { color: #94a3b8; margin-bottom: 30px; text-align: center; }
  button.menu-btn { width: 280px; padding: 16px; margin: 8px; font-size: 18px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: #fff; }
  button.menu-btn:active { transform: scale(.97); }
  .btn-solo { background: #22c55e; } .btn-online { background: #3b82f6; } .btn-back { background: #64748b; margin-top: 15px; }
  input { padding: 12px; font-size: 16px; border-radius: 8px; border: none; margin: 8px; width: 260px; }
  #playerList { background: rgba(0,0,0,.4); padding: 20px; border-radius: 12px; min-width: 280px; margin: 15px 0; }
  .player { padding: 8px; margin: 4px 0; background: rgba(255,255,255,.1); border-radius: 6px; }
  #game { display: none; position: absolute; inset: 0; z-index: 1; }
  #game canvas { display: block; width: 100%; height: 100%; }
  #info { position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,.6); padding: 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; z-index: 20; pointer-events: none; }
  #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; margin: -4px; border: 2px solid rgba(255,255,255,.8); border-radius: 50%; z-index: 20; pointer-events: none; }
  #healthBar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 220px; height: 18px; background: rgba(0,0,0,.6); border: 2px solid #fff; border-radius: 9px; overflow: hidden; z-index: 20; }
  #healthFill { height: 100%; background: linear-gradient(#4ade80, #16a34a); width: 100%; transition: width .2s; }
  #item { position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); color: #fde047; font-weight: bold; font-size: 14px; text-shadow: 0 1px 3px #000; z-index: 20; pointer-events: none; }
  #hurt { position: absolute; inset: 0; background: radial-gradient(transparent 40%, rgba(220,38,38,.55)); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 15; }
  #joystick-zone { position: absolute; bottom: 40px; left: 30px; width: 130px; height: 130px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.3); border-radius: 50%; z-index: 30; display: none; touch-action: none; }
  #joystick-thumb { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 46px; height: 46px; background: rgba(255,255,255,.5); border-radius: 50%; }
  #atkBtn { position: absolute; bottom: 50px; right: 30px; width: 90px; height: 90px; border-radius: 50%; border: 3px solid #fff; background: rgba(239,68,68,.75); color: #fff; font-weight: bold; z-index: 30; display: none; }
  #endScreen { position: absolute; inset: 0; background: rgba(0,0,0,.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; color: #fff; text-align: center; padding: 20px; }
  #endScreen .stats { background: rgba(255,255,255,.1); padding: 20px; border-radius: 12px; margin: 20px 0; min-width: 280px; font-size: 18px; }
  #pickBtn { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); padding: 12px 22px; border: 2px solid #fde047; border-radius: 12px; background: rgba(0,0,0,.75); color: #fde047; font-weight: bold; font-size: 15px; z-index: 35; display: none; }
  #invBtn { position: absolute; top: 10px; right: 10px; width: 48px; height: 48px; border-radius: 12px; border: 2px solid #fff; background: rgba(0,0,0,.6); font-size: 24px; z-index: 35; }
  #inv { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(92vw, 420px); max-height: 90vh; overflow: auto; background: rgba(15,23,42,.96); color: #fff; border: 2px solid #475569; border-radius: 16px; padding: 16px; z-index: 60; }
  #inv h3 { margin: 0 0 10px; } #slots { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .slot { padding: 12px 4px; min-height: 64px; border-radius: 10px; border: 2px solid #475569; background: #1e293b; color: #fff; font-size: 13px; }
  .slot.sel { border-color: #60a5fa; background: #1e3a8a; } .slot.eq { box-shadow: 0 0 0 2px #22c55e inset; }
  #invBtns { display: flex; gap: 8px; margin: 12px 0; } #invBtns button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; background: #3b82f6; color: #fff; } #invBtns button:disabled { opacity: .4; }
  #recipes { font-size: 12px; color: #cbd5e1; line-height: 1.6; }
  #toast { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 8px 16px; border-radius: 10px; font-size: 14px; z-index: 40; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #err { display: none; position: absolute; bottom: 0; left: 0; right: 0; background: #7f1d1d; color: #fff; padding: 8px; font-size: 12px; z-index: 999; }
</style>
</head>
<body>
<div id="menu">
  <h1>TETA TACARO</h1>
  <div class="subtitle">Battle Royale de Comédia</div>
  <button class="menu-btn btn-solo" onclick="startSolo()">Jogar Solo vs IA</button>
  <button class="menu-btn btn-online" onclick="showOnlineMenu()">Jogar Online</button>
</div>

<div id="roomMenu">
  <h1>Online</h1>
  <input type="text" id="playerName" placeholder="Seu nome" value="Jogador">
  <input type="text" id="roomName" placeholder="Nome da sala">
  <button class="menu-btn btn-online" onclick="createRoom()">Criar Sala</button>
  <button class="menu-btn btn-solo" onclick="joinRoom()">Entrar na Sala</button>
  <button class="menu-btn btn-back" onclick="backToMain()">Voltar</button>
</div>

<div id="lobby">
  <h1>Sala: <span id="currentRoom"></span></h1>
  <div class="subtitle">Mínimo 2 jogadores</div>
  <div id="playerList"></div>
  <div id="lobbyStatus">0 jogadores</div>
  <button class="menu-btn btn-solo" onclick="startOnlineGame()">Iniciar Partida</button>
  <button class="menu-btn btn-back" onclick="location.reload()">Sair</button>
</div>

<div id="game">
  <div id="info"><b>TETA TACARO</b><br><span id="hint">WASD mover · E pegar · I inventário · Espaço/clique atacar</span></div>
  <div id="crosshair"></div>
  <div id="healthBar"><div id="healthFill"></div></div>
  <div id="hurt"></div>
  <div id="item">Procure um item brilhante no chão</div>
  <div id="joystick-zone"><div id="joystick-thumb"></div></div>
  <button id="atkBtn">ATACAR</button>
  <button id="pickBtn">PEGAR</button>
  <button id="invBtn">🎒</button>
  <div id="inv"><h3>🎒 Inventário (máx. 6)</h3><div id="slots"></div>
    <div id="invBtns"><button id="combBtn">Combinar</button><button id="eqBtn">Equipar</button><button id="closeInv">Fechar</button></div>
    <div id="recipes"></div></div>
  <div id="toast"></div>
</div>

<div id="endScreen">
  <h1 id="endTitle">FIM DE JOGO</h1>
  <div class="subtitle" id="endSubtitle"></div>
  <div class="stats">Inimigos derrotados: <b id="statEnemies">0</b></div>
  <button class="menu-btn btn-solo" onclick="location.reload()">Voltar ao Menu</button>
</div>
<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const $ = id => document.getElementById(id);
window.addEventListener('error', e => { const b = $('err'); b.style.display = 'block'; b.textContent = 'Erro: ' + e.message; });

const SERVER_URL = "https://teta-tacaro.onrender.com";
const isTouch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
const W = 140, D = 140, H = 5;
let socket = null, myId = null, currentRoom = null, lobbyPlayers = [];
let scene, camera, renderer, clock, started = false;
let colliders = [], ais = [], others = {};
let isSolo = false, gameOver = false, health = 100, kills = 0, lastAtk = 0, lastSend = 0;
let yaw = 0, pitch = 0, bob = 0;
const keys = {}, jv = { x: 0, y: 0 };

// Modelos 3D
const models = {};
const gltfLoader = new THREE.GLTFLoader();
const fbxLoader = new THREE.FBXLoader();
const objLoader = new THREE.OBJLoader();

function loadModels() {
  return Promise.all([
    gltfLoader.loadAsync('models/guy.glb').then(g => { models.guy = g.scene; }).catch(() => {}),
    fbxLoader.loadAsync('models/man.fbx').then(g => { models.man = g; }).catch(() => {}),
    fbxLoader.loadAsync('models/woman.fbx').then(g => { models.woman = g; }).catch(() => {}),
    fbxLoader.loadAsync('models/baguette.fbx').then(g => { models.baguette = g; }).catch(() => {}),
    fbxLoader.loadAsync('models/bottle.fbx').then(g => { models.bottle = g; }).catch(() => {}),
    fbxLoader.loadAsync('models/pan.fbx').then(g => { models.pan = g; }).catch(() => {}),
    objLoader.loadAsync('models/broom.obj').then(g => { models.broom = g; }).catch(() => {}),
    objLoader.loadAsync('models/car.obj').then(g => { models.car = g; }).catch(() => {})
  ]);
}

function getModel(name, scale = 1) {
  if (!models[name]) return null;
  const m = models[name].clone();
  m.scale.setScalar(scale);
  m.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
  return m;
}

/* ---------- MENUS / ONLINE ---------- */
function showOnlineMenu() { $('menu').style.display = 'none'; $('roomMenu').style.display = 'flex'; getSocket(); }
function backToMain() { $('roomMenu').style.display = 'none'; $('menu').style.display = 'flex'; }
function getSocket() {
  if (socket) return socket;
  if (typeof io === 'undefined') { alert('Servidor online indisponível no momento.'); return null; }
  socket = io(SERVER_URL);
  bindSocket(socket);
  return socket;
}
function roomInfo() {
  const name = $('playerName').value || 'Jogador', room = $('roomName').value.trim();
  if (!room) { alert('Digite o nome da sala'); return null; }
  currentRoom = room; return { name, room };
}
function createRoom() { const i = roomInfo(), s = getSocket(); if (i && s) s.emit('createRoom', i); }
function joinRoom() { const i = roomInfo(), s = getSocket(); if (i && s) s.emit('joinRoom', i); }
function startOnlineGame() { if (socket) socket.emit('startGame', { room: currentRoom }); }
function startSolo() { startGame(true); }

function bindSocket(s) {
  s.on('joined', d => {
    myId = d.id; currentRoom = d.room;
    $('roomMenu').style.display = 'none'; $('lobby').style.display = 'flex';
    $('currentRoom').textContent = currentRoom; updateLobby(d.players);
  });
  s.on('updatePlayers', p => { updateLobby(p); if (scene) p.forEach(addOther); });
  s.on('playerMoved', d => {
    const o = others[d.id]; if (!o) return;
    o.position.set(d.x, 0, d.z); o.rotation.y = d.rotY || 0;
  });
  s.on('playerLeft', id => { if (others[id]) { scene.remove(others[id]); delete others[id]; } });
  s.on('gameStart', () => startGame(false));
  s.on('playerDied', d => { if (d.id === myId) endGame(false); if (others[d.id]) others[d.id].visible = false; });
  s.on('lootTaken', d => { const o = loot[d.i]; if (o && !o.taken) takeLoot(o); });
  s.on('error', m => alert(m));
}
function updateLobby(players) {
  lobbyPlayers = players;
  $('playerList').innerHTML = '';
  players.forEach(p => {
    const d = document.createElement('div'); d.className = 'player';
    d.textContent = p.name + (p.id === myId ? ' (Você)' : ''); $('playerList').appendChild(d);
  });
  $('lobbyStatus').textContent = players.length + ' jogador(es)';
}
function addOther(p) {
  if (p.id === myId || others[p.id]) return;
  const c = makeChar(0x3b82f6); c.position.set(p.x || 0, 0, p.z || 0); scene.add(c); others[p.id] = c;
}

/* ---------- TEXTURAS PROCEDURAIS ---------- */
function canvasTex(w, h, draw, rx, ry) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 4; return t;
}
const floorTex = () => canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#e9e5da'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2500; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.12)'; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.strokeStyle = '#b9b3a2'; g.lineWidth = 4; g.strokeRect(0, 0, w, h);
}, W / 2, D / 2);
const signTex = () => canvasTex(512, 128, (g, w, h) => {
  g.fillStyle = '#dc2626'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#fff'; g.font = 'bold 72px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('TETA TACARO', w / 2, h / 2 + 4);
}, 1, 1);

/* ---------- MAPA ---------- */
function std(color, o = {}) { return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .7 }, o)); }
function box(w, h, d, mat, x, y, z, collide = true, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; scene.add(m);
  if (collide) colliders.push({ x1: x - w / 2, x2: x + w / 2, z1: z - d / 2, z2: z + d / 2 });
  return m;
}
/* ---------- PERSONAGENS ---------- */
function makeChar(shirt, pants = 0x2d3748, hair = 0x3b2417) {
  const modelNames = ['guy', 'man', 'woman'];
  const available = modelNames.filter(n => models[n]);
  if (available.length) {
    const name = available[Math.floor(Math.random() * available.length)];
    const m = getModel(name, name === 'guy' ? 1.2 : 0.01);
    if (m) {
      m.userData.arms = [new THREE.Group(), new THREE.Group()];
      m.userData.legs = [new THREE.Group(), new THREE.Group()];
      return m;
    }
  }
  const g = new THREE.Group(), M = c => std(c), skin = [0xf1c9a5, 0xd9a47a, 0x8d5a3b][(Math.random() * 3) | 0];
  const add = (geo, mat, x, y, z, p = g) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; p.add(m); return m; };
  const limb = (w, h, c, x, y, hand) => {
    const p = new THREE.Group(); p.position.set(x, y, 0);
    add(new THREE.CylinderGeometry(w * .5, w * .42, h, 10), M(c), 0, -h / 2, 0, p);
    if (hand) add(new THREE.SphereGeometry(w * .5, 8, 8), M(skin), 0, -h - .02, 0, p); else add(new THREE.BoxGeometry(w * 1.1, .1, w * 1.8), M(0x111111), 0, -h + .03, -.05, p);
    g.add(p); return p;
  };
  add(new THREE.CylinderGeometry(.22, .2, .66, 14), M(shirt), 0, 1.2, 0).scale.set(1.3, 1, .8);
  add(new THREE.CylinderGeometry(.06, .07, .12, 8), M(skin), 0, 1.56, 0);
  add(new THREE.SphereGeometry(.16, 16, 12), M(skin), 0, 1.7, 0).scale.set(1, 1.12, 1);
  add(new THREE.SphereGeometry(.17, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), M(hair), 0, 1.73, .01);
  add(new THREE.BoxGeometry(.03, .05, .04), M(skin), 0, 1.68, -.16);
  [-.06, .06].forEach(x => add(new THREE.SphereGeometry(.02, 6, 6), M(0x111111), x, 1.72, -.145));
  g.userData.arms = [limb(.13, .58, shirt, -.38, 1.5, 1), limb(.13, .58, shirt, .38, 1.5, 1)];
  g.userData.legs = [limb(.19, .9, pants, -.13, .9, 0), limb(.19, .9, pants, .13, .9, 0)];
  return g;
}
function walkAnim(g, amount, t) {
  const s = Math.sin(t * 10) * .7 * amount, u = g.userData;
  u.arms[0].rotation.x = s; u.arms[1].rotation.x = -s; u.legs[0].rotation.x = -s; u.legs[1].rotation.x = s;
}

/* ---------- JOGO ---------- */
async function startGame(solo) {
  if (started) return;
  if (typeof THREE === 'undefined') { alert('Não foi possível carregar o motor 3D (three.js). Verifique a internet.'); return; }
  started = true; isSolo = solo;
  ['menu', 'lobby', 'roomMenu'].forEach(i => $(i).style.display = 'none');
  $('game').style.display = 'block';
  if (isTouch) { $('joystick-zone').style.display = 'block'; $('atkBtn').style.display = 'block'; $('hint').textContent = 'Joystick move · arraste a tela para olhar'; }

  await loadModels();

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070d); scene.fog = new THREE.Fog(0x0a0f1c, 25, 150);
  camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, .1, 300);
  camera.position.set(-24, 1.7, 36); camera.rotation.order = 'YXZ'; scene.add(camera);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  $('game').appendChild(renderer.domElement); makeEnv();

  scene.add(new THREE.HemisphereLight(0x8899cc, 0x1a1a22, .22));
  const sun = new THREE.DirectionalLight(0x8fa8ff, .22);
  sun.position.set(20, 45, 30); sun.castShadow = true;
  sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -58, right: 58, top: 58, bottom: -58, near: 1, far: 160 });
  sun.shadow.bias = -.0004; sun.shadow.normalBias = .03; scene.add(sun);

  buildMap(); buildExtras(); polish(); nightExtras();
  if (solo) spawnAI(); else { spawnLoot(); lobbyPlayers.forEach(addOther); }
  bindInput(renderer.domElement);
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  });
  clock = new THREE.Clock(); animate();
}

function hit(x, z, r) {
  if (Math.abs(x) > W / 2 - r - .3 || Math.abs(z) > D / 2 - r - .3) return true;
  return colliders.some(c => x > c.x1 - r && x < c.x2 + r && z > c.z1 - r && z < c.z2 + r);
}
function move(p, dx, dz, r = .4) {
  if (!hit(p.x + dx, p.z, r)) p.x += dx;
  if (!hit(p.x, p.z + dz, r)) p.z += dz;
}

function bindInput(cv) {
  addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') { attack(); e.preventDefault(); } });
  addEventListener('keyup', e => keys[e.code] = false);
  if (!isTouch) {
    cv.addEventListener('click', () => { if (!document.pointerLockElement) cv.requestPointerLock(); });
    cv.addEventListener('mousedown', () => { if (document.pointerLockElement) attack(); });
    addEventListener('mousemove', e => {
      if (document.pointerLockElement !== cv) return;
      yaw -= e.movementX * .0022; pitch = Math.max(-1.3, Math.min(1.3, pitch - e.movementY * .0022));
    });
    return;
  }
  const jz = $('joystick-zone'), th = $('joystick-thumb');
  let joyId = null, lookId = null, lx = 0, ly = 0;
  const joy = t => {
    const r = jz.getBoundingClientRect();
    let dx = (t.clientX - r.left - r.width / 2) / 50, dy = (t.clientY - r.top - r.height / 2) / 50, l = Math.hypot(dx, dy);
    if (l > 1) { dx /= l; dy /= l; }
    jv.x = dx; jv.y = dy; th.style.transform = `translate(calc(-50% + ${dx * 40}px), calc(-50% + ${dy * 40}px))`;
  };
  jz.addEventListener('touchstart', e => { joyId = e.changedTouches[0].identifier; joy(e.changedTouches[0]); e.preventDefault(); }, { passive: false });
  cv.addEventListener('touchstart', e => { const t = e.changedTouches[0]; lookId = t.identifier; lx = t.clientX; ly = t.clientY; }, { passive: true });
  addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyId) joy(t);
      else if (t.identifier === lookId) {
        yaw -= (t.clientX - lx) * .005; pitch = Math.max(-1.3, Math.min(1.3, pitch - (t.clientY - ly) * .005)); lx = t.clientX; ly = t.clientY;
      }
    }
  }, { passive: true });
  addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyId) { joyId = null; jv.x = jv.y = 0; th.style.transform = 'translate(-50%,-50%)'; }
      if (t.identifier === lookId) lookId = null;
    }
  });
  $('atkBtn').addEventListener('touchstart', e => { attack(); e.preventDefault(); }, { passive: false });
}

function endGame(won) {
  if (gameOver) return; gameOver = true;
  $('endTitle').textContent = won ? 'VITÓRIA!' : 'ELIMINADO';
  $('endSubtitle').textContent = won ? 'Você venceu o mercado!' : 'Você foi eliminado';
  $('statEnemies').textContent = kills; $('endScreen').style.display = 'flex';
  if (document.pointerLockElement) document.exitPointerLock();
}

/* ---------- LOOT, IA E EFEITOS ---------- */
const ITEMS=[{n:'Baguete',d:14,e:'🥖'},{n:'Frigideira',d:20,e:'🍳'},{n:'Garrafa',d:16,e:'🍾'},{n:'Vassoura',d:18,e:'🧹'},

  const itemModels = { 0: 'baguette', 1: 'pan', 2: 'bottle', 3: 'broom' };
  if (itemModels[i] && models[itemModels[i]]) {
    const m = getModel(itemModels[i], i === 3 ? 0.5 : 0.02);

  }

function attack(){
  if(gameOver||!started)return;
  const now=performance.now();if(now-lastAtk<450)return;lastAtk=now;
  swingP=1;beep(220,.07);
  if(!isSolo){if(socket)socket.emit('attack',{room:currentRoom,weapon,dmg:30+(weapon!==null?ITEMS[weapon].d:0)});return;}
  const fx_=-Math.sin(yaw),fz=-Math.cos(yaw),dmg=30+(weapon!==null?ITEMS[weapon].d:0);
  ais.forEach(a=>{
    if(a.userData.hp<=0)return;
    const dx=a.position.x-camera.position.x,dz=a.position.z-camera.position.z,dist=Math.hypot(dx,dz);
    if(dist<3.2&&(dx*fx_+dz*fz)/(dist||1)>.3){
      a.userData.hp-=dmg;move(a.position,fx_*.8,fz*.8);beep(120,.1,'sawtooth');
      burst(new THREE.Vector3(a.position.x,1.3,a.position.z),0xffffff,12);
      a.rotation.z=.25;setTimeout(()=>a.rotation.z=0,120);
      if(a.userData.hp<=0){a.visible=false;kills++;}
    }
  });
  if(ais.every(a=>a.userData.hp<=0))endGame(true);
}
function hurt(n){
  health=Math.max(0,health-n);$('healthFill').style.width=health+'%';
  $('hurt').style.opacity=1;setTimeout(()=>$('hurt').style.opacity=0,200);shake=1;beep(90,.15,'sawtooth');
  if(health<=0)endGame(false);
}
function update(dt,t){
  const f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-jv.y,r=(keys.KeyD?1:0)-(keys.KeyA?1:0)+jv.x;
  let mx=-Math.sin(yaw)*f+Math.cos(yaw)*r,mz=-Math.cos(yaw)*f-Math.sin(yaw)*r;
  const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l;}
  move(camera.position,mx*6*dt,mz*6*dt);
  bob+=Math.min(l,1)*dt*10;const sg=Math.sin(bob)>0;if(l>.1&&sg!==lastStep){lastStep=sg;beep(60,.05,'triangle');}
  camera.position.y=1.7+Math.sin(bob)*.04*Math.min(l,1);
  camera.rotation.set(pitch+(Math.random()-.5)*shake*.06,yaw+(Math.random()-.5)*shake*.06,0);

  {let nr=null,bd=2.2;loot.forEach(o=>{if(o.taken)return;const dd=Math.hypot(o.g.position.x-camera.position.x,o.g.position.z-camera.position.z);if(dd<bd){bd=dd;nr=o;}});nearLoot=nr;const pb=$('pickBtn'),tx=nr?'PEGAR '+ITEMS[nr.t].n+(isTouch?'':' [E]'):'';if(tx!==lastPick){lastPick=tx;pb.style.display=nr?'block':'none';pb.textContent=tx;}}

  ais.forEach(a=>{
    const u=a.userData;if(u.hp<=0)return;
    let tx,tz;
    if(!u.armed){ // 1) procurar loot
      if(!u.target||u.target.taken){
        u.target=null;let b=1e9;
        loot.forEach(o=>{if(o.taken||(o.claim&&o.claim!==a&&!o.claim.userData.hp<=0&&!o.claim.userData.armed))return;const d=Math.hypot(o.g.position.x-a.position.x,o.g.position.z-a.position.z);if(d<b){b=d;u.target=o;}});
        if(u.target)u.target.claim=a;
      }
      if(!u.target){walkAnim(a,0,t);return;}
      tx=u.target.g.position.x;tz=u.target.g.position.z;
      if(Math.hypot(tx-a.position.x,tz-a.position.z)<.9){equipAI(a,u.target.t);takeLoot(u.target);u.target=null;return;}
    }else{tx=camera.position.x;tz=camera.position.z;} // 2) atacar com o item
    const dx=tx-a.position.x,dz=tz-a.position.z,dist=Math.hypot(dx,dz)||1,stop=u.armed?1.7:.5;
    a.rotation.y=Math.atan2(-dx,-dz);
    if(dist>stop){
      const px=a.position.x,pz=a.position.z;
      move(a.position,dx/dist*2.8*dt,dz/dist*2.8*dt,.35);walkAnim(a,1,t);
      if(Math.hypot(a.position.x-px,a.position.z-pz)<2.8*dt*.3){
        u.stuck+=dt;move(a.position,-dz/dist*u.side*3*dt,dx/dist*u.side*3*dt,.35);
        if(u.stuck>1.5){u.side*=-1;u.stuck=0;}
      }else u.stuck=0;
    }else{
      walkAnim(a,0,t);u.cd-=dt;
      if(u.armed&&u.cd<=0){u.cd=1.1;u.sw=.35;u.hit=false;}
    }
    if(u.armed){
      if(u.sw>0){u.sw-=dt;if(u.sw<.17&&!u.hit){u.hit=true;if(dist<2.4)hurt(ITEMS[u.weapon].d);}}
      u.arms[1].rotation.x=-1.0+(u.sw>0?Math.sin((1-u.sw/.35)*Math.PI)*1.3:0);
    }
  });

  if(!isSolo&&currentRoom&&t-lastSend>.05){
    lastSend=t;socket.emit('move',{room:currentRoom,x:camera.position.x,y:camera.position.y,z:camera.position.z,rotY:yaw});
  }
}
function fxUpdate(dt,t){
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i];f.life-=dt;f.v.y-=9*dt;f.m.position.addScaledVector(f.v,dt);f.m.material.opacity=Math.max(0,f.life/.6);
    if(f.life<=0){scene.remove(f.m);f.m.material.dispose();fx.splice(i,1);}
  }
  loot.forEach(o=>{if(o.taken){if(t-o.takenAt>=60)respawnLoot(o);return;}o.it.rotation.y=t*2;o.it.position.y=1.1+Math.sin(t*3+o.t)*.12;o.beam.material.opacity=.2+Math.sin(t*4)*.07;});
  if(held){swingP=Math.max(0,swingP-dt*4);held.rotation.x=-1.2+Math.sin(swingP*Math.PI)*1.4;}
  shake=Math.max(0,shake-dt*3);
  flick.forEach(f=>{if(t>f.next){f.on=Math.random()>.4;f.next=t+(f.on?.15+Math.random()*1.6:.04+Math.random()*.12);}f.l.intensity=f.on?f.b:f.b*.08;f.m.color.setHex(f.on?f.c:0x2a2a2a);f.s.material.opacity=f.on?.4:0;});
}

function makeEnv(){
  const ec=canvasTex(256,128,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#2a3350');gr.addColorStop(.45,'#161c2e');gr.addColorStop(1,'#05070d');g.fillStyle=gr;g.fillRect(0,0,w,h);g.fillStyle='#fff';for(let i=0;i<8;i++)g.fillRect(i*32+6,6,18,10);},1,1);
  ec.mapping=THREE.EquirectangularReflectionMapping;
  const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromEquirectangular(ec).texture;
}

/* ---------- INVENTÁRIO, PEGAR E RESPAWN ---------- */
let inv=[],sel=[],nearLoot=null,invOpen=false,lastPick='';
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,2200);}
function pickup(){
  if(!nearLoot||nearLoot.taken||gameOver)return;
  if(inv.length>=6){toast('Inventário cheio (6)');return;}
  const t=nearLoot.t;inv.push(t);if(!isSolo&&socket)socket.emit('lootTaken',{room:currentRoom,i:loot.indexOf(nearLoot)});takeLoot(nearLoot);toast('Pegou: '+ITEMS[t].n);
  if(weapon===null)equipPlayer(t);renderInv();
}
function toggleInv(){invOpen=!invOpen;$('inv').style.display=invOpen?'block':'none';if(invOpen){if(document.pointerLockElement)document.exitPointerLock();renderInv();}}
function renderInv(){
  const box=$('slots');box.innerHTML='';
  for(let i=0;i<6;i++){
    const b=document.createElement('button');b.className='slot'+(sel.includes(i)?' sel':'')+(inv[i]!==undefined&&inv[i]===weapon?' eq':'');
    b.textContent=inv[i]!==undefined?ITEMS[inv[i]].e+' '+ITEMS[inv[i]].n:'—';
    b.onclick=()=>{if(inv[i]===undefined)return;sel=sel.includes(i)?sel.filter(x=>x!==i):[...sel,i].slice(-2);renderInv();};
    box.appendChild(b);
  }
  $('combBtn').disabled=!(sel.length===2&&RECIPES[rk(inv[sel[0]],inv[sel[1]])]!==undefined);
  $('eqBtn').disabled=sel.length!==1;
  $('recipes').innerHTML='<b>Receitas</b><br>'+Object.entries(RECIPES).map(([k,v])=>k.split(',').map(x=>ITEMS[x].n).join(' + ')+' → '+ITEMS[v].n+' (dano '+ITEMS[v].d+')').join('<br>');
}
function combine(){
  if(sel.length!==2)return;
  const r=RECIPES[rk(inv[sel[0]],inv[sel[1]])];if(r===undefined)return;
  inv=inv.filter((_,i)=>!sel.includes(i));inv.push(r);sel=[];equipPlayer(r);
  toast('Criou: '+ITEMS[r].n+'!');beep(880,.15,'sine');
  burst(camera.position.clone().add(new THREE.Vector3(0,-.3,-.8)),0x60a5fa,24);renderInv();
}
function equipSel(){if(sel.length!==1)return;equipPlayer(inv[sel[0]]);toast('Equipou: '+ITEMS[weapon].n);renderInv();}
function respawnLoot(o){
  o.g.remove(o.it);o.t=(o.t+1)%4;o.it=makeItem(o.t);o.it.scale.setScalar(1.3);o.it.position.y=1.1;o.it.rotation.z=.6;o.g.add(o.it);
  o.taken=false;o.claim=null;o.g.visible=true;burst(new THREE.Vector3(o.g.position.x,1.2,o.g.position.z),0xfde047,16);
}
$('pickBtn').addEventListener('click',pickup);$('invBtn').addEventListener('click',toggleInv);
$('closeInv').onclick=toggleInv;$('combBtn').onclick=combine;$('eqBtn').onclick=equipSel;
addEventListener('keydown',e=>{if(!started)return;if(e.code==='KeyE')pickup();if(e.code==='KeyI')toggleInv();});

/* ---------- ACABAMENTO VISUAL ---------- */
const ceilTex=()=>canvasTex(64,64,(g,w,h)=>{g.fillStyle='#f3f3f1';g.fillRect(0,0,w,h);for(let i=0;i<150;i++){g.fillStyle='rgba(0,0,0,.05)';g.fillRect(Math.random()*w,Math.random()*h,2,2);}g.strokeStyle='#c9c9c4';g.lineWidth=3;g.strokeRect(0,0,w,h);},133,107);

  const sk=canvasTex(16,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#05070d');gr.addColorStop(.55,'#0b1224');gr.addColorStop(.75,'#1a2236');gr.addColorStop(1,'#141b2c');g.fillStyle=gr;g.fillRect(0,0,w,h);},1,1);

  try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),gn=ac.createGain();o.frequency.value=55;gn.gain.value=.01;o.connect(gn);gn.connect(ac.destination);o.start();}catch(e){}
}

let glowT,flick=[];
function flickLamp(x,y,z,c,b,pole){
  const m=new THREE.MeshBasicMaterial({color:c}),mesh=new THREE.Mesh(pole?new THREE.SphereGeometry(.3,8,8):new THREE.BoxGeometry(2.4,.08,.3),m);mesh.position.set(x,y,z);scene.add(mesh);
  const l=new THREE.PointLight(c,b,pole?34:20);l.position.set(x,y-.3,z);scene.add(l);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,color:c,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));sp.position.set(x,y,z);sp.scale.set(pole?7:5,pole?7:5,1);scene.add(sp);
  if(pole){const po=new THREE.Mesh(new THREE.CylinderGeometry(.1,.12,y,8),std(0x475569));po.position.set(x,y/2,z);po.castShadow=true;scene.add(po);colliders.push({x1:x-.3,x2:x+.3,z1:z-.3,z2:z+.3});}
  flick.push({m,l,s:sp,b,c,next:0,on:true});
}

  for(let x=-66;x<66;x+=8)box(3,.02,.2,std(0xfacc15),x,.03,62,false,false);

  for(let i=0;i<12;i++)tree((i%2?1:-1)*(50+(i%4)*5),-62+i*9.5);
  const pad=new THREE.Mesh(new THREE.PlaneGeometry(50,30),std(0xffffff,{map:noiseTex('#6b7280',.35,12,6),roughness:.9}));pad.rotation.x=-Math.PI/2;pad.position.set(30,.011,-55);pad.receiveShadow=true;scene.add(pad);
  [[18,-62,0xb91c1c],[24,-62,0x1d4ed8],[30,-62,0x15803d],[42,-62,0xf59e0b],[18,-56,0x0e7490]].forEach(([x,z,c])=>{box(2.4,2.6,6,std(c,{metalness:.4,roughness:.5}),x,1.3,z);box(2.5,.1,6.1,std(0x111111),x,2.62,z,false);});
  [10,13].forEach(x=>box(1.8,1.2,1,std(0x166534),x,.6,-45));
  const cb=[0xb98a56,0xa97c47,0xc9a26b,0x93c5fd],pw=std(0xa16207);

  const sp=[];for(let i=0;i<400;i++){const a=Math.random()*6.283,e=Math.random()*1.2+.1;sp.push(Math.cos(a)*Math.cos(e)*265,Math.sin(e)*265,Math.sin(a)*Math.cos(e)*265);}
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,fog:false})));
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  if (!gameOver) update(dt, clock.elapsedTime);
  fxUpdate(dt, clock.elapsedTime);
  renderer.render(scene, camera);
}
