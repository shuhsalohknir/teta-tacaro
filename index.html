<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teta Tacaro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #0f172a; font-family: Arial, sans-serif; touch-action: none; }
  #menu, #lobby, #roomMenu {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: linear-gradient(135deg, #0f172a, #1e293b);
    z-index: 100; color: white;
  }
  #lobby, #roomMenu { display: none; }
  h1 { font-size: 42px; margin-bottom: 10px; text-align: center; }
  .subtitle { color: #94a3b8; margin-bottom: 30px; text-align: center; }
  button.menu-btn {
    width: 280px; padding: 16px; margin: 8px; font-size: 18px; font-weight: bold;
    border: none; border-radius: 12px; cursor: pointer; transition: 0.2s;
  }
  .btn-solo { background: #22c55e; color: white; }
  .btn-online { background: #3b82f6; color: white; }
  .btn-back { background: #64748b; color: white; margin-top: 15px; }
  input { padding: 12px; font-size: 16px; border-radius: 8px; border: none; margin: 8px; width: 260px; }
  #playerList { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 12px; min-width: 280px; margin: 15px 0; }
  .player { padding: 8px; margin: 4px 0; background: rgba(255,255,255,0.1); border-radius: 6px; }
  #info {
    position: absolute; top: 10px; left: 10px; color: #fff;
    background: rgba(0,0,0,0.75); padding: 10px; border-radius: 8px; font-size: 12px;
    max-width: 240px; line-height: 1.4; z-index: 20; pointer-events: none; display: none;
  }
  #healthBar {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 20px; background: #333; border: 2px solid #fff; border-radius: 4px;
    z-index: 20; display: none;
  }
  #healthFill { height: 100%; background: #22c55e; width: 100%; transition: width 0.2s; }
  #endScreen {
    position: absolute; inset: 0; background: rgba(0,0,0,0.85);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 200; color: white; text-align: center; padding: 20px;
  }
  #endScreen h1 { font-size: 48px; margin-bottom: 10px; }
  #endScreen .stats { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; margin: 20px 0; min-width: 280px; }
  #endScreen .stat { font-size: 18px; margin: 8px 0; }
  #game { 
    display: none; 
    position: absolute; 
    inset: 0; 
    z-index: 1;
  }
  #game canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #joystick-zone {
    position: absolute; bottom: 30px; left: 30px; width: 140px; height: 140px;
    background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25);
    border-radius: 50%; z-index: 30; display: none;
  }
  #joystick-thumb {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 40px; height: 40px; background: rgba(255,255,255,0.45); border-radius: 50%;
  }
</style>
</head>
<body>
<div id="menu">
  <h1>TETA TACARO</h1>
  <div class="subtitle">Battle Royale de Comédia</div>
  <button class="menu-btn btn-solo" onclick="startSolo()">Jogar Solo vs IA</button>
  <button class="menu-btn btn-online" onclick="showOnlineMenu()">Jogar Online</button>
</div>

<div id="roomMenu">
  <h1>Online</h1>
  <input type="text" id="playerName" placeholder="Seu nome" value="Jogador">
  <input type="text" id="roomName" placeholder="Nome da sala">
  <button class="menu-btn btn-online" onclick="createRoom()">Criar Sala</button>
  <button class="menu-btn btn-solo" onclick="joinRoom()">Entrar na Sala</button>
  <button class="menu-btn btn-back" onclick="backToMain()">Voltar</button>
</div>

<div id="lobby">
  <h1>Sala: <span id="currentRoom"></span></h1>
  <div class="subtitle">Mínimo 2 jogadores</div>
  <div id="playerList"></div>
  <div id="lobbyStatus">0 jogadores</div>
  <button class="menu-btn btn-solo" onclick="startOnlineGame()">Iniciar Partida</button>
  <button class="menu-btn btn-back" onclick="location.reload()">Sair</button>
</div>

<div id="game">
  <div id="info"><b>TETA TACARO</b><br><span id="controls-hint">WASD | Espaço = Atacar</span></div>
  <div id="healthBar"><div id="healthFill"></div></div>
  <div id="joystick-zone"><div id="joystick-thumb"></div></div>
</div>

<div id="endScreen">
  <h1 id="endTitle">FIM DE JOGO</h1>
  <div class="subtitle" id="endSubtitle"></div>
  <div class="stats">
    <div class="stat">Alvos Inimigos: <b id="statEnemies">0</b></div>
    <div class="stat">Funcionários: <b id="statEmployees">0</b></div>
    <div class="stat">Clientes: <b id="statCustomers">0</b></div>
  </div>
  <button class="menu-btn btn-solo" onclick="location.reload()">Voltar ao Menu</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/PointerLockControls.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const SERVER_URL = "https://teta-tacaro.onrender.com";
const socket = io(SERVER_URL);
const isMobile = window.innerWidth < 800;

const loader = new THREE.TextureLoader();
const textures = {};

function loadTextures() {
  return Promise.all([
    loader.loadAsync('floor.jpg').then(t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(15, 15); textures.floor = t; }).catch(() => {}),
    loader.loadAsync('shelf.jpg').then(t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, 3); textures.shelf = t; }).catch(() => {}),
    loader.loadAsync('wall.jpg').then(t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(8, 2); textures.wall = t; }).catch(() => {})
  ]);
}

let scene, camera, renderer, controls;
let colliders = [];
let otherPlayers = {};
let aiPlayers = [];
let myId = null;
let currentRoom = null;
let isSolo = false;
let playerHealth = 100;
let gameOver = false;
let stats = { enemies: 0, employees: 0, customers: 0 };

const keys = { w: false, a: false, s: false, d: false };
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();

function showOnlineMenu() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('roomMenu').style.display = 'flex';
}
function backToMain() {
  document.getElementById('roomMenu').style.display = 'none';
  document.getElementById('menu').style.display = 'flex';
}

function createRoom() {
  const name = document.getElementById('playerName').value || 'Jogador';
  const room = document.getElementById('roomName').value.trim();
  if (!room) return alert('Digite o nome da sala');
  currentRoom = room;
  socket.emit('createRoom', { name, room });
}

function joinRoom() {
  const name = document.getElementById('playerName').value || 'Jogador';
  const room = document.getElementById('roomName').value.trim();
  if (!room) return alert('Digite o nome da sala');
  currentRoom = room;
  socket.emit('joinRoom', { name, room });
}

socket.on('joined', (data) => {
  myId = data.id;
  currentRoom = data.room;
  document.getElementById('roomMenu').style.display = 'none';
  document.getElementById('lobby').style.display = 'flex';
  document.getElementById('currentRoom').textContent = currentRoom;
  updateLobby(data.players);
});

socket.on('updatePlayers', (players) => {
  updateLobby(players);
  players.forEach(p => {
    if (p.id !== myId && !otherPlayers[p.id] && scene) createOtherPlayer(p);
  });
});

socket.on('playerMoved', (data) => {
  if (otherPlayers[data.id]) {
    otherPlayers[data.id].position.set(data.x, data.y, data.z);
    otherPlayers[data.id].rotation.y = data.rotY || 0;
  }
});

socket.on('playerLeft', (id) => {
  if (otherPlayers[id]) {
    scene.remove(otherPlayers[id]);
    delete otherPlayers[id];
  }
});

socket.on('gameStart', () => startGame(false));
socket.on('playerDied', (data) => {
  if (data.id === myId) endGame(false);
  if (otherPlayers[data.id]) otherPlayers[data.id].visible = false;
});
socket.on('error', (msg) => alert(msg));

function updateLobby(players) {
  const list = document.getElementById('playerList');
  list.innerHTML = '';
  players.forEach(p => {
    const div = document.createElement('div');
    div.className = 'player';
    div.textContent = p.name + (p.id === myId ? ' (Você)' : '');
    list.appendChild(div);
  });
  document.getElementById('lobbyStatus').textContent = players.length + ' jogador(es)';
}

function startOnlineGame() {
  socket.emit('startGame', { room: currentRoom });
}

function startSolo() {
  isSolo = true;
  document.getElementById('menu').style.display = 'none';
  startGame(true);
}

async function startGame(solo) {
  isSolo = solo;
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('menu').style.display = 'none';
  document.getElementById('roomMenu').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  document.getElementById('info').style.display = 'block';
  document.getElementById('healthBar').style.display = 'block';
  if (isMobile) document.getElementById('joystick-zone').style.display = 'block';

  await loadTextures();

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 40, 120);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 300);
  camera.position.set(0, 1.7, 25);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  document.getElementById('game').appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(30, 50, 20);
  sun.castShadow = true;
  scene.add(sun);

  controls = new THREE.PointerLockControls(camera, document.body);
  document.addEventListener('click', (e) => { 
    if (!isMobile && !e.target.closest('#endScreen')) controls.lock(); 
  });

  createSimpleMap();
  if (solo) spawnAI();

  window.addEventListener('resize', onWindowResize);
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);
  animate();
}

function createSimpleMap() {
  // Chão com textura
  const floorMat = new THREE.MeshStandardMaterial({ 
    map: textures.floor || null, 
    color: textures.floor ? 0xffffff : 0x4a5568, 
    roughness: 0.85 
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), floorMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Prateleiras com textura de metal
  const shelfMat = new THREE.MeshStandardMaterial({ 
    map: textures.shelf || null, 
    color: textures.shelf ? 0xffffff : 0x718096,
    metalness: 0.3,
    roughness: 0.6
  });
  for (let i = -25; i <= 25; i += 8) {
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.4, 18), shelfMat);
    shelf.position.set(i, 1.2, -8);
    shelf.castShadow = true;
    shelf.receiveShadow = true;
    scene.add(shelf);
    colliders.push(shelf);
  }

  // Parede com textura
  const wallMat = new THREE.MeshStandardMaterial({ 
    map: textures.wall || null, 
    color: textures.wall ? 0xffffff : 0xe2e8f0 
  });
  const wall = new THREE.Mesh(new THREE.BoxGeometry(60, 4, 0.5), wallMat);
  wall.position.set(0, 2, -30);
  scene.add(wall);
}

function spawnAI() {
  const colors = [0xef4444, 0x3b82f6];
  for (let i = 0; i < 2; i++) {
    const ai = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 1.6, 0.4),
      new THREE.MeshStandardMaterial({ color: colors[i] })
    );
    body.position.y = 0.8;
    ai.add(body);
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 8, 8),
      new THREE.MeshStandardMaterial({ color: 0xf5d0a9 })
    );
    head.position.y = 1.7;
    ai.add(head);
    ai.position.set((i === 0 ? -15 : 15), 0, -10);
    ai.userData = { type: 'ai', health: 80, speed: 0.04, target: null };
    scene.add(ai);
    aiPlayers.push(ai);
  }
}

function createOtherPlayer(data) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 1.6, 0.4),
    new THREE.MeshStandardMaterial({ color: 0x3b82f6 })
  );
  body.position.y = 0.8;
  group.add(body);
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.2, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0xf5d0a9 })
  );
  head.position.y = 1.7;
  group.add(head);
  group.position.set(data.x || 0, 0, data.z || 0);
  scene.add(group);
  otherPlayers[data.id] = group;
}

function onKeyDown(e) {
  switch (e.code) {
    case 'KeyW': keys.w = true; break;
    case 'KeyA': keys.a = true; break;
    case 'KeyS': keys.s = true; break;
    case 'KeyD': keys.d = true; break;
    case 'Space': attack(); break;
  }
}
function onKeyUp(e) {
  switch (e.code) {
    case 'KeyW': keys.w = false; break;
    case 'KeyA': keys.a = false; break;
    case 'KeyS': keys.s = false; break;
    case 'KeyD': keys.d = false; break;
  }
}

function attack() {
  if (gameOver) return;
  if (isSolo) {
    aiPlayers.forEach(ai => {
      if (camera.position.distanceTo(ai.position) < 4 && ai.userData.health > 0) {
        ai.userData.health -= 30;
        if (ai.userData.health <= 0) {
          ai.visible = false;
          stats.enemies++;
        }
      }
    });
  } else if (currentRoom) {
    socket.emit('attack', { room: currentRoom });
  }
}

function updateAI() {
  aiPlayers.forEach(ai => {
    if (ai.userData.health <= 0) return;
    const dist = ai.position.distanceTo(camera.position);
    if (dist > 3) {
      const dir = new THREE.Vector3().subVectors(camera.position, ai.position).normalize();
      ai.position.x += dir.x * ai.userData.speed;
      ai.position.z += dir.z * ai.userData.speed;
      ai.lookAt(camera.position.x, ai.position.y, camera.position.z);
    } else if (Math.random() > 0.98) {
      takeDamage(8);
    }
  });
  if (aiPlayers.every(ai => ai.userData.health <= 0) && isSolo && !gameOver) endGame(true);
}

function takeDamage(amount) {
  playerHealth = Math.max(0, playerHealth - amount);
  document.getElementById('healthFill').style.width = playerHealth + '%';
  if (playerHealth <= 0) endGame(false);
}

function endGame(won) {
  if (gameOver) return;
  gameOver = true;
  document.getElementById('endTitle').textContent = won ? 'VITÓRIA!' : 'ELIMINADO';
  document.getElementById('endSubtitle').textContent = won ? 'Você venceu!' : 'Você foi eliminado';
  document.getElementById('statEnemies').textContent = stats.enemies;
  document.getElementById('endScreen').style.display = 'flex';
  if (controls) controls.unlock();
}

function onWindowResize() {
  if (!camera) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  if (!scene || gameOver) return;

  const delta = 0.016;
  velocity.x -= velocity.x * 8 * delta;
  velocity.z -= velocity.z * 8 * delta;

  let moveZ = Number(keys.w) - Number(keys.s);
  let moveX = Number(keys.d) - Number(keys.a);
  direction.set(moveX, 0, moveZ);
  if (direction.length() > 0) direction.normalize();

  if (direction.lengthSq() > 0) {
    velocity.z -= direction.z * 32 * delta;
    velocity.x -= direction.x * 32 * delta;
  }

  controls.moveRight(-velocity.x * delta);
  controls.moveForward(-velocity.z * delta);

  if (isSolo) updateAI();

  if (!isSolo && myId && currentRoom) {
    socket.emit('move', {
      room: currentRoom,
      x: camera.position.x,
      y: camera.position.y,
      z: camera.position.z,
      rotY: camera.rotation.y
    });
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
